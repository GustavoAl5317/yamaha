# Proxy reverso HTTPS para o dashboard.
# URL final: https://intc01.ind.intcloud.com.br/dashboard/help-desk
#
# Instalar em: /etc/nginx/sites-available/yamaha-dash
# Certificado:  /etc/nginx/ssl/intc01.crt  +  /etc/nginx/ssl/intc01.key
# (troque pelo certificado emitido pela CA da Interatell quando disponível)

server {
    listen 80;
    server_name intc01.ind.intcloud.com.br;
    # Todo tráfego HTTP vai para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name intc01.ind.intcloud.com.br;

    ssl_certificate     /etc/nginx/ssl/intc01.crt;
    ssl_certificate_key /etc/nginx/ssl/intc01.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/yamaha-dash.access.log;
    error_log  /var/log/nginx/yamaha-dash.error.log;

    # Raiz redireciona para o painel
    location = / {
        return 302 /dashboard/help-desk;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
